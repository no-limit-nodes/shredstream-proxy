name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    # Debian 11 (glibc 2.31) so the binary runs on Ubuntu 20.04+ / Debian 11+.
    container: rust:1.84-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Debian 11 left the regular mirrors at end of life (2026-08); its packages
      # now live on archive.debian.org. Keep bullseye for the glibc 2.31 floor.
      - name: Use the Debian 11 archive
        run: |
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive

      - name: Install build tools
        run: apt-get update -qq && apt-get install -y -qq ca-certificates libssl-dev protobuf-compiler pkg-config libudev-dev zlib1g-dev llvm clang cmake make libprotobuf-dev g++ binutils >/dev/null

      - name: Build (generic x86-64, no AVX2 needed)
        env:
          RUSTFLAGS: -C target-cpu=x86-64
          # reed-solomon-erasure compiles its C code with -march=haswell (AVX2)
          # unless told otherwise; RUSTFLAGS does not reach it.
          RUST_REED_SOLOMON_ERASURE_ARCH: x86-64
        run: cargo build --release --locked --bin jito-shredstream-proxy

      - name: Check no AVX2 in shred recovery
        run: |
          n=$(objdump -d --no-show-raw-insn target/release/jito-shredstream-proxy \
            | awk '/^[0-9a-f]+ <reedsolomon_/{f=1;next} /^[0-9a-f]+ </{f=0} f' \
            | grep -c '%ymm' || true)
          echo "AVX2 instructions in reedsolomon_* functions: $n"
          test "$n" -eq 0

      - name: Package
        run: |
          f=jito-shredstream-proxy-x86_64-unknown-linux-gnu
          cp target/release/jito-shredstream-proxy "$f"
          sha256sum "$f" > "$f.sha256"
          ls -lh "$f"
          cat "$f.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            ./jito-shredstream-proxy-x86_64-unknown-linux-gnu
            ./jito-shredstream-proxy-x86_64-unknown-linux-gnu.sha256
